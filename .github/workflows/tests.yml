name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce small paper tables
        run: python examples/paper_examples.py --max-n 6
      - name: Reproduce small unlabeled sequences
        run: python examples/unlabeled_counts.py --max-n 10

  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with Arb certification
        run: python -m pip install '.[certify]'
      - name: Run asymptotic tests
        run: python -m unittest tests.test_c1f_asymptotics -v
