[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unaryfomc"
version = "0.1.0"
description = "Exact labeled and unlabeled model counting with one unary function"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Ondrej Kuzelka"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
speed = ["gmpy2>=2.2"]
certify = ["python-flint==0.8.0; python_version >= '3.11'"]
full = [
    "gmpy2>=2.2",
    "python-flint==0.8.0; python_version >= '3.11'",
]

[project.scripts]
unaryfomc = "unaryfomc.__main__:main"

[project.urls]
Paper = "https://arxiv.org/abs/2608.30580"
Source = "https://github.com/supertweety/UnaryFOMC"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
